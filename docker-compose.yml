services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - ./.azurite:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    command: ["--protocol", "https"]
    ports:
      - "8081:8081"
      - "8080:8080"
      - "1234:1234"
    volumes:
      - cosmos-vnext-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    tty: true
    stdin_open: true
    mem_limit: 3g
    restart: unless-stopped

  db-migrate:
    image: python:3.11-slim
    working_dir: /app
    depends_on:
      cosmosdb:
        condition: service_healthy
      azurite:
        condition: service_healthy
    volumes:
      - ./api:/app:ro
    command: >
      python -c "import pathlib; schema = pathlib.Path('/app/migrations/001-storage-schema.json'); print(f'Cosmos schema detected: {schema.exists()}')"
    restart: "no"

volumes:
  cosmos-data:
  cosmos-vnext-data:
